<svg width="500" height="280" viewBox="0 0 520 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: Ribbon N -->
  <!-- Define gradients -->
  <defs>
    <linearGradient id="leftTeal" x1="80" y1="200" x2="170" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0FB5A3"/>
      <stop offset="100%" stop-color="#14C9B5"/>
    </linearGradient>
    <linearGradient id="centerBlue" x1="180" y1="90" x2="240" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A7CFF"/>
      <stop offset="45%" stop-color="#0A58D1"/>
      <stop offset="100%" stop-color="#0B65E6"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="240" y1="180" x2="380" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#083C96"/>
      <stop offset="30%" stop-color="#0A6FE3"/>
      <stop offset="100%" stop-color="#14C9B5"/>
    </linearGradient>
  </defs>

  <!-- Left leg of N (teal) -->
  <path d="M 95 210 
           C 80 210, 65 200, 86 175
           L 150 78 
           C 158 66, 184 70, 184 94
           L 184 118
           C 184 118, 165 108, 150 122
           L 108 200
           C 104 208, 100 210, 95 210Z" fill="#14C9B5"/>
  <!-- Center valley (deep blue) -->
  <path d="M 184 94
           C 204 94, 212 105, 218 134
           L 230 190
           C 234 210, 258 225, 280 218
           L 255 198
           L 220 145
           C 210 125, 198 105, 184 118
           Z" fill="#0A58D1"/>
  <path d="M 184 94
           C 194 96, 204 102, 210 120
           L 228 185
           C 236 208, 250 218, 268 218
           C 246 228, 228 225, 218 205
           L 200 150
           C 192 118, 184 118, 184 94Z" fill="#0B5BD3" opacity="0.95"/>
  <!-- Right leg of N -->
  <path d="M 268 218
           C 290 218, 308 200, 320 178
           L 378 82
           C 388 64, 410 62, 418 84
           C 425 105, 405 118, 395 135
           L 325 190
           C 310 210, 286 223, 268 218Z" fill="url(#rightGrad)"/>

  <!-- Plus sign top right -->
  <rect x="425" y="28" width="78" height="28" rx="9" fill="#14B9A6"/>
  <rect x="440" y="14" width="28" height="78" rx="9" fill="#14B9A6"/>
  <rect x="442" y="16" width="24" height="74" rx="7" fill="#16C1AD" opacity="0.95"/>

  <!-- Text: Nhealth -->
  <text x="260" y="235" text-anchor="middle" font-family="'Plus Jakarta Sans', 'IBM Plex Sans', sans-serif" font-size="102" font-weight="800" fill="#0F2F5C" letter-spacing="-3.5">Nhealth</text>
  <!-- Tagline -->
  <g transform="translate(0,258)">
    <line x1="45" y1="7" x2="110" y2="7" stroke="#5A7A96" stroke-width="3.2" stroke-linecap="round"/>
    <text x="260" y="13" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="500" fill="#5A7A96" letter-spacing="3.2">Healthcare at Home</text>
    <line x1="410" y1="7" x2="475" y2="7" stroke="#5A7A96" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
